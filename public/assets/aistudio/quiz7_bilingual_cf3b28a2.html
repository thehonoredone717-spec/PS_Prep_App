<html lang="en">

<title>Computing Quiz</title>

<style>
:root {
  --paper: #f4f2ec;
  --card: #ffffff;
  --ink: #1d2430;
  --muted: #5d6675;
  --line: #d9d6cc;
  --accent: #0d5c63;
  --ok: #1e7a4a;
  --ok-bg: #e7f4ec;
  --bad: #b42318;
  --bad-bg: #fbe9e7;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

  color: var(--ink);

  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.langs button {
  font: inherit; font-size: 14px; border: none; background: transparent; color: var(--muted);
  padding: 7px 14px; cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.langs button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
h1, h2 {
  font-family: "IBM Plex Serif", Georgia, serif;
  font-weight: 600; line-height: 1.25; text-wrap: balance; margin: 0;
}
h1 { font-size: 28px; margin-bottom: 6px; }
h2 { font-size: 21px; margin-bottom: 16px; }
.card {

.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }

label { display: block; font-weight: 500; margin: 14px 0 6px; }
input[type="text"], select {

.btn {
  font: inherit; font-weight: 600; border: none; border-radius: 8px; padding: 12px 20px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn:disabled { background: #a9b4b6; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.options { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.opt:disabled { cursor: default; }
.opt .letter {
  flex: 0 0 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--paper); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted);
}
.opt.correct { background: var(--ok-bg); border-color: var(--ok); }
.opt.correct .letter { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.feedback { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 15px; display: none; }
.feedback.show { display: block; }
.feedback.good { background: var(--ok-bg); color: #145a34; }
.feedback.bad { background: var(--bad-bg); color: #7a1a12; }
.feedback strong { display: block; margin-bottom: 4px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.score-big { font-family: "IBM Plex Serif", Georgia, serif; font-size: 44px; font-weight: 600; color: var(--accent); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.grade {
  display: inline-block; margin: 8px 0 4px; padding: 6px 12px; border-radius: 999px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
}
table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; }
.review { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.review ol { padding-left: 22px; margin: 8px 0 0; }
.review li { margin-bottom: 14px; }
.review .q { font-weight: 500; }
.review .ans { font-size: 14px; color: var(--muted); margin-top: 2px; }
.review .yes { color: var(--ok); font-weight: 600; }
.review .no { color: var(--bad); font-weight: 600; }
.review .why { font-size: 14px; color: var(--muted); margin-top: 2px; }
.scale { font-size: 14px; color: var(--muted); margin: 14px 0 0; padding: 10px 12px; background: var(--paper); border-radius: 8px; }
.foot { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 420px) { h1 { font-size: 24px; } .card { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>

const LETTERS = ["A", "B", "C", "D"];
let lang = "en";
let state = { screen: "start", name: "", scope: "all", qs: [], i: 0, answers: [] };

const app = document.getElementById("app");

function t(key) { return UI[lang][key]; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gradeOf(pct) {
  if (pct >= 86) return 5;
  if (pct >= 71) return 4;
  if (pct >= 56) return 3;
  return 2;
}

function topicById(id) { return DATA.find((x) => x.id === id); }

function setStaticText() {
  document.getElementById("brand").textContent = UI[lang].brand;
  document.getElementById("foot").textContent = UI[lang].foot;
  document.documentElement.lang = lang === "uz" ? "uz" : "en";
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  document.getElementById("lang-uz").setAttribute("aria-pressed", String(lang === "uz"));
}

function setLang(l) {
  lang = l;
  setStaticText();
  render();
}

function render() {
  if (state.screen === "start") renderStart();
  else if (state.screen === "quiz") renderQuestion();
  else renderResults();
}

function startQuiz(scope) {
  const pool = [];
  const topics = scope === "all" ? DATA : DATA.filter((x) => x.id === scope);
  topics.forEach((tp) => tp.questions.forEach((q) => pool.push({ topic: tp.id, q, order: shuffle([0, 1, 2, 3]) })));
  state = { screen: "quiz", name: state.name, scope, qs: scope === "all" ? shuffle(pool) : pool, i: 0, answers: [] };
  render();
}

function renderStart() {
  app.textContent = "";
  app.append(el("h2", null, t("start_h")), el("p", "muted", t("start_p")));

  const nameLabel = el("label", null, t("name"));
  nameLabel.setAttribute("for", "name");
  const nameInput = el("input");
  nameInput.type = "text";
  nameInput.id = "name";
  nameInput.maxLength = 40;
  nameInput.value = state.name;

  const scopeLabel = el("label", null, t("scope"));
  scopeLabel.setAttribute("for", "scope");
  const sel = el("select");
  sel.id = "scope";
  const optAll = el("option", null, t("all"));
  optAll.value = "all";
  sel.appendChild(optAll);
  DATA.forEach((tp) => {
    const o = el("option", null, tp.label[lang] + " (" + tp.questions.length + ")");
    o.value = tp.id;
    sel.appendChild(o);
  });
  sel.value = state.scope;

  const scale = el("div", "scale");
  scale.append(el("strong", null, t("scale_h") + ": "), el("span", null, t("scale")));

  const actions = el("div", "actions");
  const btn = el("button", "btn", t("start"));
  btn.type = "button";
  btn.addEventListener("click", () => {
    state.name = nameInput.value.trim();
    startQuiz(sel.value);
  });
  actions.appendChild(btn);

  app.append(nameLabel, nameInput, scopeLabel, sel, scale, actions);
  nameInput.focus();
}

function renderQuestion() {
  app.textContent = "";
  const n = state.qs.length;
  const item = state.qs[state.i];
  const q = item.q;
  const tp = topicById(item.topic);
  const prev = state.answers[state.i];

  const top = el("div", "progress-top");
  top.append(el("span", null, tp.label[lang]), el("span", null, t("question_of")(state.i + 1, n)));
  const bar = el("div", "bar");
  const fill = el("div");
  fill.style.width = (state.i / n * 100) + "%";
  bar.appendChild(fill);

  const h = el("h2", null, q.q[lang]);
  const opts = el("div", "options");
  const buttons = [];
  const fb = el("div", "feedback");
  const next = el("button", "btn", state.i === n - 1 ? t("finish") : t("next"));
  next.type = "button";
  next.disabled = !prev;

  const correctPos = item.order.indexOf(q.answer);

  function showAnswer(chosenPos) {
    const orig = item.order[chosenPos];
    const right = orig === q.answer;
    buttons.forEach((b, k) => {
      b.disabled = true;
      if (k === correctPos) b.classList.add("correct");
    });
    if (!right) buttons[chosenPos].classList.add("wrong");
    fb.className = "feedback show " + (right ? "good" : "bad");
    fb.textContent = "";
    fb.append(
      el("strong", null, right ? t("right") : t("wrong") + " " + t("answer") + ": " + LETTERS[correctPos] + ") " + q.opts[lang][q.answer]),
      el("span", null, q.explain[lang])
    );
    next.disabled = false;
  }

  item.order.forEach((orig, pos) => {
    const b = el("button", "opt");
    b.type = "button";
    b.append(el("span", "letter", LETTERS[pos]), el("span", null, q.opts[lang][orig]));
    b.addEventListener("click", () => {
      if (state.answers[state.i]) return;
      state.answers[state.i] = { chosenPos: pos, right: orig === q.answer, topic: item.topic };
      showAnswer(pos);
      next.focus();
    });
    buttons.push(b);
    opts.appendChild(b);
  });

  if (prev) showAnswer(prev.chosenPos);

  next.addEventListener("click", () => {
    if (state.i === n - 1) { renderResults(); return; }
    state.i++;
    renderQuestion();
  });

  const actions = el("div", "actions");
  actions.appendChild(next);
  app.append(top, bar, h, opts, fb, actions);
}

function renderResults() {
  app.textContent = "";
  const n = state.qs.length;
  const score = state.answers.filter((a) => a && a.right).length;
  const pct = Math.round(score / n * 100);
  const g = gradeOf(pct);
  const msg = pct >= 86 ? t("msg_hi") : (pct >= 56 ? t("msg_mid") : t("msg_lo"));

  app.append(el("h2", null, state.name ? t("well_done")(state.name) : t("result_h")));
  app.append(el("div", "score-big", score + " / " + n));
  app.append(el("p", "muted", pct + "% " + t("pct") + ". " + msg));
  app.append(el("div", "grade", t("grade") + ": " + g + " · " + UI[lang].g[g]));

  // Per-topic breakdown
  const scopeTopics = state.scope === "all" ? DATA : DATA.filter((x) => x.id === state.scope);
  const tbl = el("table");
  const thead = el("tr");
  thead.append(el("th", null, t("topic")), el("th", "num", t("right_col")), el("th", "num", "%"), el("th", "num", t("grade")));
  tbl.appendChild(thead);
  scopeTopics.forEach((tp) => {
    const idxs = state.qs.map((it, k) => (it.topic === tp.id ? k : -1)).filter((k) => k >= 0);
    const right = idxs.filter((k) => state.answers[k] && state.answers[k].right).length;
    const tot = idxs.length;
    const p = tot ? Math.round(right / tot * 100) : 0;
    const tr = el("tr");
    tr.append(el("td", null, tp.label[lang]), el("td", "num", right + " / " + tot), el("td", "num", p + "%"), el("td", "num", String(gradeOf(p))));
    tbl.appendChild(tr);
  });
  app.append(tbl);

  // Review
  const review = el("div", "review");
  review.append(el("h2", null, t("review")));
  const ol = el("ol");
  state.qs.forEach((item, k) => {
    const q = item.q;
    const a = state.answers[k];
    const li = el("li");
    li.append(el("div", "q", q.q[lang]));
    const chosenText = a ? q.opts[lang][item.order[a.chosenPos]] : t("none");
    const ans = el("div", "ans");
    ans.append(
      el("span", a && a.right ? "yes" : "no", a && a.right ? t("right") : t("wrong")),
      el("span", null, " · " + t("you_chose") + ": " + chosenText + " · " + t("answer") + ": " + q.opts[lang][q.answer])
    );
    li.append(ans, el("div", "why", q.explain[lang]));
    ol.appendChild(li);
  });
  review.appendChild(ol);
  app.appendChild(review);

  const actions = el("div", "actions");
  const again = el("button", "btn", t("try_again"));
  again.type = "button";
  again.addEventListener("click", () => startQuiz(state.scope));
  const change = el("button", "btn ghost", t("change"));
  change.type = "button";
  change.addEventListener("click", () => { state.screen = "start"; render(); });
  actions.append(change, again);
  app.appendChild(actions);
}

document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-uz").addEventListener("click", () => setLang("uz"));
setStaticText();
state.screen = "start";
render();
</script>
</body>
</html>
