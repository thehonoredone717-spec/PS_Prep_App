<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 7 Computing Quiz</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4f2ec;
  --card: #ffffff;
  --ink: #1d2430;
  --muted: #5d6675;
  --line: #d9d6cc;
  --accent: #0d5c63;
  --ok: #1e7a4a;
  --ok-bg: #e7f4ec;
  --bad: #b42318;
  --bad-bg: #fbe9e7;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.langs button {
  font: inherit; font-size: 14px; border: none; background: transparent; color: var(--muted);
  padding: 7px 14px; cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.langs button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
h1, h2 {
  font-family: "IBM Plex Serif", Georgia, serif;
  font-weight: 600; line-height: 1.25; text-wrap: balance; margin: 0;
}
h1 { font-size: 28px; margin-bottom: 6px; }
h2 { font-size: 21px; margin-bottom: 16px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; box-shadow: 0 1px 2px rgba(29, 36, 48, .05);
}
.muted { color: var(--muted); font-size: 15px; }
.progress-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
label { display: block; font-weight: 500; margin: 14px 0 6px; }
input[type="text"], select {
  width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; color: var(--ink);
}
input[type="text"]:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.btn {
  font: inherit; font-weight: 600; border: none; border-radius: 8px; padding: 12px 20px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn:disabled { background: #a9b4b6; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.options { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.opt:disabled { cursor: default; }
.opt .letter {
  flex: 0 0 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--paper); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted);
}
.opt.correct { background: var(--ok-bg); border-color: var(--ok); }
.opt.correct .letter { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.feedback { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 15px; display: none; }
.feedback.show { display: block; }
.feedback.good { background: var(--ok-bg); color: #145a34; }
.feedback.bad { background: var(--bad-bg); color: #7a1a12; }
.feedback strong { display: block; margin-bottom: 4px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.score-big { font-family: "IBM Plex Serif", Georgia, serif; font-size: 44px; font-weight: 600; color: var(--accent); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.grade {
  display: inline-block; margin: 8px 0 4px; padding: 6px 12px; border-radius: 999px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
}
table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; }
.review { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.review ol { padding-left: 22px; margin: 8px 0 0; }
.review li { margin-bottom: 14px; }
.review .q { font-weight: 500; }
.review .ans { font-size: 14px; color: var(--muted); margin-top: 2px; }
.review .yes { color: var(--ok); font-weight: 600; }
.review .no { color: var(--bad); font-weight: 600; }
.review .why { font-size: 14px; color: var(--muted); margin-top: 2px; }
.scale { font-size: 14px; color: var(--muted); margin: 14px 0 0; padding: 10px 12px; background: var(--paper); border-radius: 8px; }
.foot { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 420px) { h1 { font-size: 24px; } .card { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand" id="brand"></span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-uz" aria-pressed="false">O'zbekcha</button>
    </div>
  </div>
  <div id="app" class="card" aria-live="polite"></div>
  <p class="foot" id="foot"></p>
</div>

anday qayta so'raydi?"}, "opts": {"en": ["It requests that the packet is sent again", "It deletes all of the other packets", "It turns the network switch off now", "It changes the IP address of sender"], "uz": ["Paketni qayta yuborishni so'raydi", "Boshqa barcha paketlarni o'chiradi", "Tarmoq kommutatorini o'chirib qo'yadi", "Yuboruvchi IP manzilini o'zgartiradi"]}, "answer": 0, "explain": {"en": "If a packet is dropped, the receiver can request that the packet is sent again.", "uz": "Yo'qolgan (dropped) paket uchun qabul qiluvchi uni qayta yuborishni so'raydi."}}, {"q": {"en": "During packet switching, why can packets be sent by different routes?", "uz": "Paketlar almashinuvida nega turli yo'llar bilan yuborilishi mumkin?"}, "opts": {"en": ["They can travel through different routers", "They must all pass through one single cable", "Routers store the packets for a long time", "The sender always uses the same route"], "uz": ["Turli routerlar orqali manzilga yetib boradi", "Ularning hammasi bitta kabeldan o'tadi", "Routerlar paketlarni doimiy saqlaydi", "Yuboruvchi har safar bir xil yo'lni tanlaydi"]}, "answer": 0, "explain": {"en": "Packets can be sent across the network using different routes, often travelling through many different devices.", "uz": "Paketlar tarmoqda turli yo'nalishlar bo'yicha, ko'plab qurilmalar orqali yuboriladi."}}, {"q": {"en": "What does HTTPS add compared with HTTP?", "uz": "HTTPS HTTP bilan solishtirganda nimani qo'shadi?"}, "opts": {"en": ["Encryption, which improves security", "Faster printing of web pages online", "A domain name for each web server", "A wireless access point for Wi-Fi"], "uz": ["Xavfsizlikni oshiradigan shifrlash", "Veb-sahifalarni tezroq chop etish", "Har bir server uchun domen nomi", "Simsiz kirish nuqtasi, Wi-Fi uchun"]}, "answer": 0, "explain": {"en": "HTTPS is the same as HTTP but with added encryption to improve security.", "uz": "HTTPS HTTP ga shifrlashni qo'shib, xavfsizlikni oshiradi."}}]}, {"id": "t4", "label": {"en": "Topic 4 · Data, storage and sound", "uz": "4-mavzu · Ma'lumot, xotira va ovoz"}, "questions": [{"q": {"en": "How many bits are in a nibble?", "uz": "Nibble tarkibida nechta bit bor?"}, "opts": {"en": ["4 bits, which is half of a byte", "8 bits, which is the same as a byte", "16 bits, which is two bytes together", "2 bits, which is one binary pair"], "uz": ["4 bit, ya'ni bayt yarmi hajmida", "8 bit, bayt bilan bir xil hajmda", "16 bit, ikki bayt birga teng", "2 bit, bitta ikkilik juftlik"]}, "answer": 0, "explain": {"en": "A nibble is 4 bits, so it is half of a byte.", "uz": "Nibble — 4 bit, ya'ni bayt yarmi."}}, {"q": {"en": "A file is 2 kilobytes in size. Using 1 kilobyte = 1000 bytes and 1 byte = 8 bits, how many bits is it?", "uz": "Fayl hajmi 2 kilobayt. 1 kilobayt = 1000 bayt, 1 bayt = 8 bit bo'lsa, u necha bit?"}, "opts": {"en": ["16000 bits in total", "2000 bits in total", "16 bits in total", "256 bits in total"], "uz": ["Jami 16000 bit hajmda", "Jami 2000 bit hajmda", "Jami 16 bit hajmda", "Jami 256 bit hajmda"]}, "answer": 0, "explain": {"en": "2 kilobytes = 2000 bytes, and 2000 × 8 = 16000 bits.", "uz": "2 kilobayt = 2000 bayt, 2000 × 8 = 16000 bit."}}, {"q": {"en": "What does a bit depth of 16 mean for a sound sample?", "uz": "Ovoz namunasi uchun 16 bitli bit chuqurligi nimani anglatadi?"}, "opts": {"en": ["16 bits are used to store each sound sample", "16 samples are recorded every single second", "The sound has a frequency of 16 hertz", "The sound lasts for a total of 16 seconds"], "uz": ["Har bir ovoz namunasi 16 bit bilan saqlanadi", "Har sekundda aynan 16 ta namuna olinadi", "Ovozning chastotasi 16 gertsga teng", "Ovoz jami 16 soniyagacha davom etadi"]}, "answer": 0, "explain": {"en": "Bit depth is the number of bits used to store a single sound sample.", "uz": "Bit chuqurligi bitta ovoz namunasini saqlash uchun ishlatiladigan bitlar sonidir."}}, {"q": {"en": "What does an analogue-to-digital converter (ADC) do?", "uz": "Analog-raqamli o'zgartirgich (ADC) nima qiladi?"}, "opts": {"en": ["Turns analogue voice signals into digital ones", "Turns digital files into printed pages here", "Stores binary data for a very long time", "Translates source code into machine code"], "uz": ["Analog signalni (ovoz) raqamliga aylantiradi", "Raqamli fayllarni qog'ozga chop etib beradi", "Ikkilik ma'lumotni uzoq vaqt saqlab turadi", "Kodni mashina koduga tarjima qilib beradi"]}, "answer": 0, "explain": {"en": "An ADC converts analogue signals, e.g. the human voice, to digital signals.", "uz": "ADC analog signalni, masalan inson ovozini, raqamli signalga aylantiradi."}}, {"q": {"en": "A sample rate of 44100 means what?", "uz": "Namuna chastotasi (sample rate) 44100 bo'lsa, bu nimani anglatadi?"}, "opts": {"en": ["How many sound samples are taken per second", "How many bits each sample uses in total", "The number of files stored on a disk drive", "The speed of the internet connection now"], "uz": ["Har sekundda necha ovoz namunasi olinishini", "Har bir namuna necha bit ishlatishini", "Diskda saqlangan fayllarning umumiy sonini", "Internet ulanish tezligini o'lchashini"]}, "answer": 0, "explain": {"en": "Sample rate is the number of sound samples taken each second.", "uz": "Sample rate — har sekundda olinadigan ovoz namunalari soni."}}, {"q": {"en": "Arrange these storage units from smallest to largest.", "uz": "Quyidagi xotira birliklarini kichigidan kattasiga qarab tartiblang."}, "opts": {"en": ["Bit, byte, kilobyte, megabyte", "Megabyte, bit, byte, kilobyte", "Byte, bit, megabyte, kilobyte", "Kilobyte, megabyte, bit, byte"], "uz": ["Bit, bayt, kilobayt, megabayt", "Megabayt, bit, bayt, kilobayt", "Bayt, bit, megabayt, kilobayt", "Kilobayt, megabayt, bit, bayt"]}, "answer": 0, "explain": {"en": "A bit is the smallest unit, then a byte (8 bits), then a kilobyte (1000 bytes), then a megabyte (1000 kilobytes).", "uz": "Bit eng kichigi, keyin bayt (8 bit), kilobayt (1000 bayt), megabayt (1000 kilobayt)."}}]}, {"id": "t5", "label": {"en": "Topic 5 · Transmission errors and checks", "uz": "5-mavzu · Uzatish xatolari va tekshiruvlar"}, "questions": [{"q": {"en": "Power surges can cause bits to flip. What is the most often given cause?", "uz": "Quvvat sakrashi bitlarning teskarilanishiga olib keladi. Ko'pincha qaysi sabab ko'rsatiladi?"}, "opts": {"en": ["Faulty wiring or nearby lightning strikes", "Using a keyboard far too often each day", "Printing very large documents each day", "Saving many files inside folders each day"], "uz": ["Nosoz simlar yoki yaqin chaqmoq urishi", "Klaviaturadan juda tez-tez foydalanish", "Katta hajmli hujjatlarni chop etish", "Fayllarni turli papkalarda saqlash"]}, "answer": 0, "explain": {"en": "Power surges are usually caused by faulty wiring or lightning strikes.", "uz": "Quvvat sakrashi odatda nosoz simlar yoki chaqmoq urishidan kelib chiqadi."}}, {"q": {"en": "Many electrical devices are used close together in one small area. What error can result?", "uz": "Kichik xonada ko'p elektr qurilmalar ishlatilsa, qanday xato yuz berishi mumkin?"}, "opts": {"en": ["Interference that disrupts transmissions", "A binary overflow inside the RAM memory", "A terminator that absorbs all signals", "A file server running out of space"], "uz": ["Ma'lumot uzatishni buzadigan interferensiya", "RAM'da ikkilik qiymatlar to'lib ketishi", "Signallarni to'liq yutadigan terminator", "Fayl serveri xotirasining to'liq tugashi"]}, "answer": 0, "explain": {"en": "Interference occurs when a number of electrical devices are used in a small area and disrupt each other's signals.", "uz": "Interferensiya kichik joyda ko'p qurilma ishlaganda signallarni buzadi."}}, {"q": {"en": "A parity bit makes the number of 1 bits even. The byte 0100 0011 has three 1s. What parity bit is added?", "uz": "Parity bit 1 lar sonini juft qiladi. 0100 0011 da uchta 1 bor. Qanday parity bit qo'shiladi?"}, "opts": {"en": ["1, making the total number of 1s even", "0, making the total number of 1s odd", "1, making the total number of 1s odd", "0, making the byte one bit longer"], "uz": ["1, shunda 1 lar soni juft bo'ladi", "0, shunda 1 lar soni toq bo'ladi", "1, shunda 1 lar soni toq bo'ladi", "0, shunda bayt uzunroq bo'ladi"]}, "answer": 0, "explain": {"en": "The byte has three 1s, so adding a 1 gives four 1s, which is even.", "uz": "Uchta 1 bor, bitta 1 qo'shsak to'rtta bo'ladi — bu juft son."}}, {"q": {"en": "What does a parity check do?", "uz": "Parity tekshiruvi nima qiladi?"}, "opts": {"en": ["It checks that data has been sent correctly", "It stores the data permanently on disk", "It translates the data into HLL code", "It increases the bandwidth of a link"], "uz": ["Ma'lumot to'g'ri uzatilganini tekshiradi", "Ma'lumotni doimiy ravishda diskda saqlaydi", "Ma'lumotni HLL tiliga tarjima qilib beradi", "Polosa kengligini sezilarli oshiradi"]}, "answer": 0, "explain": {"en": "A parity check is a type of error check that ensures data has been transmitted correctly.", "uz": "Parity tekshiruvi ma'lumot to'g'ri uzatilganini kafolatlaydigan xato tekshiruvidir."}}, {"q": {"en": "A hardware firewall device is hacked. What is a possible result?", "uz": "Apparat firewall buzib kirildi. Mumkin bo'lgan natija qaysi?"}, "opts": {"en": ["Rules change to allow any data into the network", "The network switch stores more files now", "The sound sample rate doubles in value", "The processor becomes much faster overall"], "uz": ["Qoidalar o'zgarib, istalgan ma'lumot kiradi", "Tarmoq kommutatori ko'proq fayl saqlaydi", "Ovoz namunasi chastotasi ikki barobar oshadi", "Protsessor ancha tezroq ishlay boshlaydi"]}, "answer": 0, "explain": {"en": "If a firewall is hacked, its rules could be changed to allow any data into the network.", "uz": "Hakerlangan firewall qoidalarini o'zgartirib, tarmoqni xavf ostiga qo'yishi mumkin."}}, {"q": {"en": "A network switch fails. What is the likely effect on data transmission?", "uz": "Tarmoq kommutatori ishdan chiqdi. Ma'lumot uzatishga ta'siri qanday?"}, "opts": {"en": ["Errors occur and packets are misrouted", "The screen becomes much brighter than before", "Files are compressed automatically by the OS", "The keyboard stops working completely"], "uz": ["Xatolar yuz beradi, paketlar adashadi", "Ekran ancha yorqinroq bo'lib qoladi", "Fayllar avtomatik ravishda siqiladi", "Klaviatura butunlay ishlamay qoladi"]}, "answer": 0, "explain": {"en": "If a network switch failed, this could cause errors, with packets no longer routed to the correct places.", "uz": "Kommutator ishlamasa, paketlar noto'g'ri joyga yuboriladi va xatolar paydo bo'ladi."}}]}, {"id": "t6", "label": {"en": "Topic 6 · Software and utilities", "uz": "6-mavzu · Dasturiy ta'minot va yordamchi dasturlar"}, "questions": [{"q": {"en": "Which of these is an example of applications software?", "uz": "Qaysi biri amaliy (applications) dasturiga misol?"}, "opts": {"en": ["A word processor used to write reports", "The operating system, managing hardware", "A utility that defragments a hard drive", "A device driver that runs a printer"], "uz": ["Hisobotlar yozish uchun matn muharriri", "Apparatni boshqaradigan operatsion tizim", "Diskni tartiblaydigan yordamchi dastur", "Printerni boshqaradigan drayver dasturi"]}, "answer": 0, "explain": {"en": "Applications software is designed to do a particular task, such as a word processor or spreadsheet.", "uz": "Amaliy dastur muayyan vazifani bajarish uchun mo'ljallangan, masalan matn muharriri."}}, {"q": {"en": "What is the role of a device driver?", "uz": "Qurilma drayverining vazifasi nima?"}, "opts": {"en": ["It lets the OS use a connected hardware device", "It stores files for many different users", "It writes program code directly in binary", "It prints a list of all installed software"], "uz": ["OS ulangan apparatdan foydalanishga imkon beradi", "Ko'p foydalanuvchi uchun fayllarni saqlaydi", "Dastur kodini bevosita ikkilik shaklda yozadi", "O'rnatilgan dasturlar ro'yxatini chop etadi"]}, "answer": 0, "explain": {"en": "A device driver is a software program that operates a hardware device connected to a computer.", "uz": "Qurilma drayveri kompyuterga ulangan apparatni operatsion tizim bilan ishlatadigan dasturdir."}}, {"q": {"en": "Why does a disc defragmenter help a computer run faster?", "uz": "Disk defragmentatori nega kompyuterni tezlashtiradi?"}, "opts": {"en": ["It reorganises file pieces for faster reads", "It deletes every single file on the drive", "It increases the screen resolution level", "It removes the operating system entirely"], "uz": ["Fayl qismlarini tartiblab, tezroq o'qiydi", "Qattiq diskdagi barcha fayllarni o'chiradi", "Ekran o'lchami va aniqligini oshiradi", "Operatsion tizimni butunlay olib tashlaydi"]}, "answer": 0, "explain": {"en": "Defragmentation reorganises files stored on a hard drive so all parts of the same file are one after the other.", "uz": "Defragmentatsiya fayl qismlarini ketma-ket joylashtirib, ularni tezroq o'qish imkonini beradi."}}, {"q": {"en": "What is a network operating system (NOS)?", "uz": "Tarmoq operatsion tizimi (NOS) nima?"}, "opts": {"en": ["An OS that supports networks and admin tools", "A game that is played over the internet", "A program for designing only web pages", "A hardware device connecting two networks"], "uz": ["Tarmoqlarni qo'llaydigan, admin vositali OS", "Internet orqali o'ynaladigan o'yin dasturi", "Faqat veb-sahifa yaratish uchun dastur", "Tarmoqlarni ulaydigan apparat qurilmasi"]}, "answer": 0, "explain": {"en": "A network operating system is computer operating system that supports networks, often including administrator software and monitoring tools.", "uz": "NOS tarmoqni boshqarishni qo'llab-quvvatlaydigan operatsion tizimdir."}}, {"q": {"en": "Which interface lets a user operate a computer by typing commands?", "uz": "Qaysi interfeys foydalanuvchiga buyruqlarni yozib, kompyuterni boshqarish imkonini beradi?"}, "opts": {"en": ["Command line, navigated by typing in commands", "Graphical user interface, using clickable icons", "Touchscreen only, operated by finger touch", "Voice pattern recognition, operated by speech"], "uz": ["Buyruq satri, buyruqlar yozish orqali boshqariladi", "Grafik interfeys, grafikalarni bosish orqali boshqariladi", "Faqat sensorli ekran, barmoq bilan boshqariladi", "Ovoz namunasini tanish, gapirish orqali boshqariladi"]}, "answer": 0, "explain": {"en": "The command line is a way of using an operating system that is navigated by typing commands.", "uz": "Buyruq satri operatsion tizimni buyruqlarni yozish orqali boshqarish usulidir."}}, {"q": {"en": "Which utility software checks files on a computer for malicious content?", "uz": "Qaysi yordamchi dastur kompyuterdagi fayllarni zararli kontentga tekshiradi?"}, "opts": {"en": ["Antivirus software, checking files for malware", "A spreadsheet application for calculating values", "A web browser, which opens and shows web pages", "A plug-and-play device, which sets up itself"], "uz": ["Fayllarni zararli kontentga tekshiruvchi dastur", "Elektron jadval, qiymatlarni hisoblaydi", "Veb-brauzer, veb-sahifalarni ochib beradi", "Plug-and-play qurilma, avtomatik sozlanadi"]}, "answer": 0, "explain": {"en": "Virus scanning checks files on a computer system for malicious content, as antivirus software does.", "uz": "Antivirus fayllarni viruslar va zararli kontent uchun skanerlaydi."}}]}, {"id": "t7", "label": {"en": "Topic 7 · Security and authentication", "uz": "7-mavzu · Xavfsizlik va autentifikatsiya"}, "questions": [{"q": {"en": "Which security method identifies a person using a fingerprint or facial features?", "uz": "Barmoq izi yoki yuz xususiyatlari orqali odamni aniqlaydigan xavfsizlik usuli qaysi?"}, "opts": {"en": ["Biometric security, using fingerprints or faces", "Brute-force, trying many password combinations", "Defragmentation, reorganising files on a disc", "Ransomware, locking files until payment is made"], "uz": ["Biometrik xavfsizlik, barmoq izi yoki yuz orqali", "Brute-force hujumi, ko'p parol kombinatsiyasini sinash", "Defragmentatsiya, diskdagi fayllarni tartiblash", "Ransomware, to'lov uchun fayllarni qulflaydi"]}, "answer": 0, "explain": {"en": "Biometric security identifies people using a physical attribute, such as a fingerprint or face.", "uz": "Biometrik xavfsizlik barmoq izi, yuz yoki ko'z pardasi kabi jismoniy xususiyatdan foydalanadi."}}, {"q": {"en": "A user signs in with a password, then enters a code sent to a mobile phone. What is this?", "uz": "Foydalanuvchi parol bilan kiradi, so'ng telefoniga yuborilgan kodni kiritadi. Bu nima?"}, "opts": {"en": ["Two-factor authentication, using two checks to sign in", "Plaintext transmission, sending data unencrypted", "Parity checking, checking data was sent correctly", "Packet switching, splitting data into small packets"], "uz": ["Ikki bosqichli autentifikatsiya, kirish uchun ikki tekshiruv", "Plaintext uzatish, shifrlanmagan ma'lumot yuborish", "Parity tekshiruvi, ma'lumot to'g'ri yuborilganini tekshirish", "Paketlarni almashtirish, ma'lumotni kichik paketlarga bo'lish"]}, "answer": 0, "explain": {"en": "Two-factor authentication requires a user to confirm their identity using a second device, such as a mobile phone.", "uz": "Ikki bosqichli autentifikatsiya ikkinchi qurilma orqali qo'shimcha tekshiruvni talab qiladi."}}, {"q": {"en": "What is encryption?", "uz": "Shifrlash (encryption) nima?"}, "opts": {"en": ["Scrambling data so it cannot be read if caught", "Making a copy of files in another location", "Splitting a file into small packets to send", "Reducing the size of a file for storage"], "uz": ["Ushlansa ham o'qib bo'lmaydigan qilish", "Fayllarni boshqa joyga nusxalab saqlash", "Faylni kichik paketlarga bo'lib yuborish", "Faylning hajmini ancha kamaytirib qo'yish"]}, "answer": 0, "explain": {"en": "Encryption converts information into a scrambled form so that it cannot be understood if it is intercepted.", "uz": "Shifrlash ma'lumotni shunday o'zgartiradiki, uni ushlab olgan kishi o'qiy olmaydi."}}, {"q": {"en": "Why could a hacker easily read data sent between devices?", "uz": "Haker ma'lumotni nega osonlikcha o'qishi mumkin?"}, "opts": {"en": ["Plaintext, which is sent without any encryption", "Binary data that includes parity bits", "Packets that arrive in the correct order", "Data that is kept stored in ROM memory"], "uz": ["Shifrlanmagan holda yuboriladigan plaintext", "Parity bit qo'shilgan ikkilik ma'lumot", "To'g'ri tartibda kelgan paketlar to'plami", "ROM xotirasida doimiy saqlangan ma'lumot"]}, "answer": 0, "explain": {"en": "Data sent as plaintext, if not encrypted, could be intercepted and read by a hacker.", "uz": "Shifrlanmagan (plaintext) ma'lumotni ushlab olib o'qish mumkin."}}, {"q": {"en": "What is a brute-force attack?", "uz": "Brute-force hujumi nima?"}, "opts": {"en": ["Trying dictionary passwords until one works", "Reorganising all the files on a hard drive", "Blocking all network traffic with a firewall", "Scanning one single file for any viruses"], "uz": ["Katta lug'atdagi parollarni birma-bir sinash", "Qattiq diskdagi fayllarni qayta tartiblash", "Firewall bilan tarmoq trafigini bloklash", "Fayldagi viruslarni skanerlab tekshirish"]}, "answer": 0, "explain": {"en": "A brute-force attack uses a large dictionary to try multiple password combinations until it is successful.", "uz": "Brute-force hujumi katta lug'atdagi parollarni birma-bir sinab, to'g'risini topadi."}}, {"q": {"en": "Which of these is the best example of a PIN?", "uz": "PIN ga eng yaxshi misol qaysi?"}, "opts": {"en": ["A passcode of digits for entering a device", "A fingerprint that is scanned by a sensor", "A picture of a face used for logging in", "A cable that connects two separate networks"], "uz": ["Qurilmaga kirish uchun raqamli passcode", "Sensor orqali skanerlangan barmoq izi", "Kirish uchun ishlatiladigan yuz rasmi", "Ikki tarmoqni bog'laydigan maxsus kabel"]}, "answer": 0, "explain": {"en": "A PIN is a passcode that allows a user access to a digital device.", "uz const LETTERS = ["A", "B", "C", "D"];
let lang = "en";
let state = { screen: "start", name: "", scope: "all", qs: [], i: 0, answers: [] };

const app = document.getElementById("app");

function t(key) { return UI[lang][key]; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gradeOf(pct) {
  if (pct >= 86) return 5;
  if (pct >= 71) return 4;
  if (pct >= 56) return 3;
  return 2;
}

function topicById(id) { return DATA.find((x) => x.id === id); }

function setStaticText() {
  document.getElementById("brand").textContent = UI[lang].brand;
  document.getElementById("foot").textContent = UI[lang].foot;
  document.documentElement.lang = lang === "uz" ? "uz" : "en";
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  document.getElementById("lang-uz").setAttribute("aria-pressed", String(lang === "uz"));
}

function setLang(l) {
  lang = l;
  setStaticText();
  render();
}

function render() {
  if (state.screen === "start") renderStart();
  else if (state.screen === "quiz") renderQuestion();
  else renderResults();
}

function startQuiz(scope) {
  const pool = [];
  const topics = scope === "all" ? DATA : DATA.filter((x) => x.id === scope);
  topics.forEach((tp) => tp.questions.forEach((q) => pool.push({ topic: tp.id, q, order: shuffle([0, 1, 2, 3]) })));
  state = { screen: "quiz", name: state.name, scope, qs: scope === "all" ? shuffle(pool) : pool, i: 0, answers: [] };
  render();
}

function renderStart() {
  app.textContent = "";
  app.append(el("h2", null, t("start_h")), el("p", "muted", t("start_p")));

  const nameLabel = el("label", null, t("name"));
  nameLabel.setAttribute("for", "name");
  const nameInput = el("input");
  nameInput.type = "text";
  nameInput.id = "name";
  nameInput.maxLength = 40;
  nameInput.value = state.name;

  const scopeLabel = el("label", null, t("scope"));
  scopeLabel.setAttribute("for", "scope");
  const sel = el("select");
  sel.id = "scope";
  const optAll = el("option", null, t("all"));
  optAll.value = "all";
  sel.appendChild(optAll);
  DATA.forEach((tp) => {
    const o = el("option", null, tp.label[lang] + " (" + tp.questions.length + ")");
    o.value = tp.id;
    sel.appendChild(o);
  });
  sel.value = state.scope;

  const scale = el("div", "scale");
  scale.append(el("strong", null, t("scale_h") + ": "), el("span", null, t("scale")));

  const actions = el("div", "actions");
  const btn = el("button", "btn", t("start"));
  btn.type = "button";
  btn.addEventListener("click", () => {
    state.name = nameInput.value.trim();
    startQuiz(sel.value);
  });
  actions.appendChild(btn);

  app.append(nameLabel, nameInput, scopeLabel, sel, scale, actions);
  nameInput.focus();
}

function renderQuestion() {
  app.textContent = "";
  const n = state.qs.length;
  const item = state.qs[state.i];
  const q = item.q;
  const tp = topicById(item.topic);
  const prev = state.answers[state.i];

  const top = el("div", "progress-top");
  top.append(el("span", null, tp.label[lang]), el("span", null, t("question_of")(state.i + 1, n)));
  const bar = el("div", "bar");
  const fill = el("div");
  fill.style.width = (state.i / n * 100) + "%";
  bar.appendChild(fill);

  const h = el("h2", null, q.q[lang]);
  const opts = el("div", "options");
  const buttons = [];
  const fb = el("div", "feedback");
  const next = el("button", "btn", state.i === n - 1 ? t("finish") : t("next"));
  next.type = "button";
  next.disabled = !prev;

  const correctPos = item.order.indexOf(q.answer);

  function showAnswer(chosenPos) {
    const orig = item.order[chosenPos];
    const right = orig === q.answer;
    buttons.forEach((b, k) => {
      b.disabled = true;
      if (k === correctPos) b.classList.add("correct");
    });
    if (!right) buttons[chosenPos].classList.add("wrong");
    fb.className = "feedback show " + (right ? "good" : "bad");
    fb.textContent = "";
    fb.append(
      el("strong", null, right ? t("right") : t("wrong") + " " + t("answer") + ": " + LETTERS[correctPos] + ") " + q.opts[lang][q.answer]),
      el("span", null, q.explain[lang])
    );
    next.disabled = false;
  }

  item.order.forEach((orig, pos) => {
    const b = el("button", "opt");
    b.type = "button";
    b.append(el("span", "letter", LETTERS[pos]), el("span", null, q.opts[lang][orig]));
    b.addEventListener("click", () => {
      if (state.answers[state.i]) return;
      state.answers[state.i] = { chosenPos: pos, right: orig === q.answer, topic: item.topic };
      showAnswer(pos);
      next.focus();
    });
    buttons.push(b);
    opts.appendChild(b);
  });

  if (prev) showAnswer(prev.chosenPos);

  next.addEventListener("click", () => {
    if (state.i === n - 1) { renderResults(); return; }
    state.i++;
    renderQuestion();
  });

  const actions = el("div", "actions");
  actions.appendChild(next);
  app.append(top, bar, h, opts, fb, actions);
}

function renderResults() {
  app.textContent = "";
  const n = state.qs.length;
  const score = state.answers.filter((a) => a && a.right).length;
  const pct = Math.round(score / n * 100);
  const g = gradeOf(pct);
  const msg = pct >= 86 ? t("msg_hi") : (pct >= 56 ? t("msg_mid") : t("msg_lo"));

  app.append(el("h2", null, state.name ? t("well_done")(state.name) : t("result_h")));
  app.append(el("div", "score-big", score + " / " + n));
  app.append(el("p", "muted", pct + "% " + t("pct") + ". " + msg));
  app.append(el("div", "grade", t("grade") + ": " + g + " · " + UI[lang].g[g]));

  // Per-topic breakdown
  const scopeTopics = state.scope === "all" ? DATA : DATA.filter((x) => x.id === state.scope);
  const tbl = el("table");
  const thead = el("tr");
  thead.append(el("th", null, t("topic")), el("th", "num", t("right_col")), el("th", "num", "%"), el("th", "num", t("grade")));
  tbl.appendChild(thead);
  scopeTopics.forEach((tp) => {
    const idxs = state.qs.map((it, k) => (it.topic === tp.id ? k : -1)).filter((k) => k >= 0);
    const right = idxs.filter((k) => state.answers[k] && state.answers[k].right).length;
    const tot = idxs.length;
    const p = tot ? Math.round(right / tot * 100) : 0;
    const tr = el("tr");
    tr.append(el("td", null, tp.label[lang]), el("td", "num", right + " / " + tot), el("td", "num", p + "%"), el("td", "num", String(gradeOf(p))));
    tbl.appendChild(tr);
  });
  app.append(tbl);

  // Review
  const review = el("div", "review");
  review.append(el("h2", null, t("review")));
  const ol = el("ol");
  state.qs.forEach((item, k) => {
    const q = item.q;
    const a = state.answers[k];
    const li = el("li");
    li.append(el("div", "q", q.q[lang]));
    const chosenText = a ? q.opts[lang][item.order[a.chosenPos]] : t("none");
    const ans = el("div", "ans");
    ans.append(
      el("span", a && a.right ? "yes" : "no", a && a.right ? t("right") : t("wrong")),
      el("span", null, " · " + t("you_chose") + ": " + chosenText + " · " + t("answer") + ": " + q.opts[lang][q.answer])
    );
    li.append(ans, el("div", "why", q.explain[lang]));
    ol.appendChild(li);
  });
  review.appendChild(ol);
  app.appendChild(review);

  const actions = el("div", "actions");
  const again = el("button", "btn", t("try_again"));
  again.type = "button";
  again.addEventListener("click", () => startQuiz(state.scope));
  const change = el("button", "btn ghost", t("change"));
  change.type = "button";
  change.addEventListener("click", () => { state.screen = "start"; render(); });
  actions.append(change, again);
  app.appendChild(actions);
}

document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-uz").addEventListener("click", () => setLang("uz"));
setStaticText();
state.screen = "start";
render();
</script>
</body>
</html>
